<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girişli Hesap Makinesi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 280px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        .calc-btn {
            width: 22%;
            height: 45px;
            margin: 1%;
            font-size: 18px;
        }
        #error-msg { color: red; font-size: 14px; }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="login-container" class="box">
        <h2>Giriş Yap</h2>
        <input type="text" id="username" placeholder="Kullanıcı Adı">
        <input type="password" id="password" placeholder="Şifre">
        <button type="button" onclick="girisYap()">Giriş Yap</button>
        <p id="error-msg"></p>
    </div>

    <!-- HESAP MAKİNESİ (BAŞLANGIÇTA GİZLİ) -->
    <div id="calculator-container" class="box" style="display: none;">
        <h2>Hesap Makinesi</h2>
        <input type="text" id="display" readonly style="text-align: right; font-size: 20px; margin-bottom: 15px;">
        <div>
            <button class="calc-btn" onclick="appendValue('7')">7</button>
            <button class="calc-btn" onclick="appendValue('8')">8</button>
            <button class="calc-btn" onclick="appendValue('9')">9</button>
            <button class="calc-btn" onclick="appendValue('/')">/</button>
        </div>
        <div>
            <button class="calc-btn" onclick="appendValue('4')">4</button>
            <button class="calc-btn" onclick="appendValue('5')">5</button>
            <button class="calc-btn" onclick="appendValue('6')">6</button>
            <button class="calc-btn" onclick="appendValue('*')">*</button>
        </div>
        <div>
            <button class="calc-btn" onclick="appendValue('1')">1</button>
            <button class="calc-btn" onclick="appendValue('2')">2</button>
            <button class="calc-btn" onclick="appendValue('3')">3</button>
            <button class="calc-btn" onclick="appendValue('-')">-</button>
        </div>
        <div>
            <button class="calc-btn" onclick="appendValue('0')">0</button>
            <button class="calc-btn" onclick="clearDisplay()">C</button>
            <button class="calc-btn" onclick="calculate()">=</button>
            <button class="calc-btn" onclick="appendValue('+')">+</button>
        </div>
    </div>

    <script>
        function girisYap() {
            const kullaniciInput = document.getElementById("username").value.trim();
            const sifreInput = document.getElementById("password").value.trim();
            const hataMesaji = document.getElementById("error-msg");

            // BELİRLEDİĞİN KULLANICI ADI VE ŞİFRE:
            const dogruKullanici = "admin";
            const dogruSifre = "1234";

            if (kullaniciInput === dogruKullanici && sifreInput === dogruSifre) {
                document.getElementById("login-container").style.display = "none";
                document.getElementById("calculator-container").style.display = "block";
            } else {
                hataMesaji.innerText = "Kullanıcı adı veya şifre hatalı!";
            }
        }

        function appendValue(val) {
            document.getElementById("display").value += val;
        }

        function clearDisplay() {
            document.getElementById("display").value = "";
        }

        function calculate() {
            try {
                document.getElementById("display").value = eval(document.getElementById("display").value);
            } catch {
                document.getElementById("display").value = "Hata";
            }
        }
    </script>
</body>
</html>
